# Site statique — aucune étape de build (pages HTML/JS servies telles quelles).
[build]
  publish = "."
  command = ""

# URL neutre pour l'espace staff : /console sert la console.
# Réécriture (status 200) → l'URL affichée reste /console, plus jamais « /admin ».
[[redirects]]
  from = "/console"
  to = "/admin.html"
  status = 200
# L'ancienne adresse /admin bascule vers /console.
[[redirects]]
  from = "/admin"
  to = "/console"
  status = 301

# --- Lausanne Open : app joueurs (/players) et son backend (/open-admin) ---
# Réécritures (200) : l'URL affichée reste courte, facile à imprimer sur un
# badge ou à mettre en QR code.
[[redirects]]
  from = "/players"
  to = "/open.html"
  status = 200
[[redirects]]
  from = "/open-admin"
  to = "/open-admin.html"
  status = 200

# En-têtes de sécurité de base.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Toujours revalider HTML/CSS/JS → plus jamais d'ancienne version en cache.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
