# Site Netlify DÉDIÉ à la console spectateurs du Lausanne Open.
# Dans les réglages du site Netlify : base directory = "welcome".
[build]
  publish = "."
  command = ""

# --- Anciennes URL du site Wix : aucune ne doit tomber en 404 ---
# Elles circulent dans des mails, des flyers et sur Google.
[[redirects]]
  from = "/partenariats"
  to = "/#partenaires"
  status = 301
[[redirects]]
  from = "/programmedujour"
  to = "/#tournoi"
  status = 301
[[redirects]]
  from = "/apropos"
  to = "/#tournoi"
  status = 301
[[redirects]]
  from = "/events"
  to = "/#tournoi"
  status = 301
[[redirects]]
  from = "/initiation"
  to = "/#tournoi"
  status = 301

# Les pages d inscription vivent desormais dans site/ (le futur
# lausanneopen.ch) : une seule copie, un seul formulaire Netlify.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pas de cache sur le code : jamais d'ancienne version pendant le tournoi.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
