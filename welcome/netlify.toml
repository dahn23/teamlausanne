# Site Netlify DÉDIÉ à la console spectateurs du Lausanne Open.
# Dans les réglages du site Netlify : base directory = "welcome".
[build]
  publish = "."
  command = ""

# URL courtes : les liens deja diffuses doivent tomber juste.
[[redirects]]
  from = "/samedi-famille"
  to = "/samedi-famille.html"
  status = 200
[[redirects]]
  from = "/tennis-lunchs"
  to = "/tennis-lunchs.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pas de cache sur le code : jamais d'ancienne version pendant le tournoi.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
