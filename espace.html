<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <!-- Application (connexion, console, Mon espace) : hors de Google. Le site public, c'est teamlausanne.ch. -->
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3ad1" />
  <title>Mon espace — Team Lausanne</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/pwa/admin-touch-icon.png?v=2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Team Lausanne" />
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Polices de marque : Acumin Pro + Circe (kit Adobe uxl8yzy).
       Noto Sans = repli officiel prevu par les guidelines de marque. -->
  <link rel="stylesheet" href="https://use.typekit.net/uxl8yzy.css" />
  <!-- Poppins : la police de l'interface (console + Mon espace). Noto Sans reste
       en repli, il est prevu par la charte. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="style.css?v=400" />
</head>
<body class="portal">

  <!-- ---------- Écran d'attente ----------
       VISIBLE par défaut, effacé par espace.js dès qu'un écran est prêt.
       S'il n'est jamais effacé, c'est que le module n'a pas démarré (hors
       connexion : la bibliothèque Supabase vient d'un autre domaine). Sans ce
       bloc, la famille n'avait qu'une PAGE BLANCHE — #pt-login et #pt-app
       commencent tous deux cachés, et seul le JavaScript les révèle.
       Script classique et non module : il s'exécute même quand le module tombe. -->
  <div id="pt-boot" class="pt-boot">
    <!-- Dimensions = le rapport réel du fichier (1937x2000), pas un carré :
         la CSS le blanchit et le cale sur le logo de l'écran de démarrage. -->
    <img class="pt-boot-logo" src="assets/logo-academie.webp" alt="Team Lausanne" width="230" height="238" />
    <p class="pt-boot-msg" id="pt-boot-msg">Chargement…</p>
    <button type="button" class="pt-err-b" id="pt-boot-retry" hidden>Réessayer</button>
  </div>
  <script>
    (function () {
      var minuteur = setTimeout(function () {
        var m = document.getElementById("pt-boot-msg"), b = document.getElementById("pt-boot-retry");
        if (!m) return;
        m.innerHTML = navigator.onLine
          ? "<b>Mon espace n'a pas pu démarrer.</b><br>Vérifie ta connexion, puis réessaie."
          : "<b>Pas de connexion.</b><br>Mon espace a besoin d'Internet pour afficher tes cours. Réessaie dès que la connexion revient.";
        if (b) { b.hidden = false; b.onclick = function () { location.reload(); }; }
      }, 6000);
      window.ptBooted = function () {
        clearTimeout(minuteur);
        var e = document.getElementById("pt-boot");
        if (e) e.remove();
      };
    })();
  </script>

  <!-- ---------- Connexion ---------- -->
  <div id="pt-login" class="pt-login hidden">
    <form id="pt-login-form" class="pt-login-card">
      <div class="pt-login-mascot" id="pt-login-mascot"></div>
      <h1>Mon espace</h1>
      <p class="muted">Connecte-toi pour voir tes cours, tes infos et les news du club.</p>
      <label>Email<input type="email" id="pt-email" autocomplete="email" required /></label>
      <label>Mot de passe<input type="password" id="pt-password" autocomplete="current-password" required /></label>
      <button type="submit" id="pt-login-btn">Se connecter</button>
      <p id="pt-login-error" class="error" hidden></p>
      <a class="pt-back" href="reset.html">Mot de passe oublié ?</a>
      <a class="pt-back" href="index.html">← Retour au site</a>
    </form>
  </div>

  <!-- ---------- Application ---------- -->
  <div id="pt-app" class="pt-app hidden">
    <header class="pt-top">
      <img class="pt-logo" src="assets/logo-academie.webp" alt="Team Lausanne" />
      <div class="pt-top-title" id="pt-view-title">Accueil</div>
      <button id="pt-to-console" class="pt-logout pt-switch hidden" title="Passer à l'espace staff">⇄ Staff</button>
      <button id="pt-logout" class="pt-logout" aria-label="Se déconnecter" title="Se déconnecter"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></svg></button>
    </header>

    <!-- Proposition d'installer l'app, montrée UNIQUEMENT dans un navigateur
         de téléphone. C'est ici, juste après l'activation, que la personne est
         le plus disposée à le faire : l'e-mail est déjà refermé. -->
    <div id="pt-install" class="pt-install hidden"></div>

    <!-- sélecteur d'enfants liés au compte -->
    <div id="pt-youths" class="pt-youths hidden"></div>

    <main class="pt-main">
      <section id="view-accueil"  class="pt-view"></section>
      <section id="view-cours"    class="pt-view hidden"></section>
      <section id="view-matchs"   class="pt-view hidden"></section>
      <section id="view-feuille"  class="pt-view hidden"></section>
      <section id="view-comp"     class="pt-view hidden"></section>
      <section id="view-profil"   class="pt-view hidden"></section>
      <section id="view-calendrier" class="pt-view hidden"></section>
      <section id="view-stages"   class="pt-view hidden"></section>
      <section id="view-physique" class="pt-view hidden"></section>
      <section id="view-contact"  class="pt-view hidden"></section>
    </main>

    <!-- Lecteur d'actualité : un article du site, lu DANS l'app (on ne renvoie
         pas la famille vers le navigateur). Rempli par espace.js. -->
    <div id="pt-actu-read" class="pt-actu-read hidden"></div>

    <!-- assistant / mascotte -->
    <!-- assistant masqué pour l'instant (décision Dan 23.09.2026) : le bouton reste en place, caché -->
    <button id="pt-bot" class="pt-bot hidden" aria-label="Assistant"></button>
    <div id="pt-bot-panel" class="pt-bot-panel hidden">
      <div class="pt-bot-head"><span id="pt-bot-avatar"></span><b>Rebond</b>
        <button id="pt-bot-close" aria-label="Fermer">✕</button></div>
      <div class="pt-bot-log" id="pt-bot-log"></div>
      <div class="pt-bot-quick" id="pt-bot-quick"></div>
    </div>

    <!-- barre d'onglets -->
    <nav class="pt-nav">
      <button class="pt-nav-item active" data-view="accueil">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Accueil</span></button>
      <button class="pt-nav-item" data-view="calendrier">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M6.5 13h4M13.5 13h4M6.5 17h4"/></svg><span>Calendrier</span></button>
      <button class="pt-nav-item" data-view="cours">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Cours</span></button>
      <button class="pt-nav-item hidden" data-view="matchs" id="pt-nav-matchs">
        <svg viewBox="0 0 24 24"><path d="M5 21V3.5"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg><span>Saison</span></button>
      <button class="pt-nav-item hidden" data-view="feuille" id="pt-nav-feuille">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3V2h6v1"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg><span>Match</span></button>
      <button class="pt-nav-item hidden" data-view="physique" id="pt-nav-physique">
        <svg viewBox="0 0 24 24"><path d="M6.5 8v8M3.5 10v4M17.5 8v8M20.5 10v4M6.5 12h11"/></svg><span>Physique</span></button>
      <button class="pt-nav-item hidden" data-view="comp" id="pt-nav-comp">
        <svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-3 9c.6.5 1 1 1 2h4c0-1 .4-1.5 1-2a5 5 0 0 0-3-9z"/><path d="M9.5 20h5M10 17h4"/></svg><span>Mental</span></button>
      <button class="pt-nav-item" data-view="stages">
        <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M7 10v5c0 1 2 3 5 3s5-2 5-3v-5"/></svg><span>Stages</span></button>
      <button class="pt-nav-item" data-view="profil">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profil</span></button>
      <button class="pt-nav-item" data-view="contact">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg><span>Contact</span></button>
      <!-- « Plus » : quand la barre a trop d'onglets (joueurs), Stages, Profil et Contact passent dans ce menu -->
      <button class="pt-nav-more hidden" id="pt-nav-more" type="button" aria-haspopup="true">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Plus</span></button>
    </nav>
    <div class="pt-more-menu hidden" id="pt-more-menu"></div>
  </div>

  <script type="module" src="espace.js"></script>
</body>
</html>
