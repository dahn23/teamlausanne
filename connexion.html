<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <!-- Application (connexion, console, Mon espace) : hors de Google. Le site public, c'est teamlausanne.ch. -->
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123cc4" />
  <title>Connexion — Team Lausanne</title>
  <!-- Ouverture express (16.11.2026). L'app s'ouvre ici puis repartait vers la console : cette page chargeait
       d'abord Supabase, relisait la session, les rôles, le statut de responsable… pour finir par la même
       redirection qu'à chaque fois. On se souvient donc de la destination (tl-landing, posée par
       landingAfterLogin) et on y part tout de suite, AVANT même les feuilles de style — un script placé après
       elles attendrait qu'elles soient chargées. La page d'arrivée revérifie tout : session expirée → son
       formulaire, rôle retiré → Mon espace. Garde-fous : une seule fois par onglet (tl-fast), sinon une
       session morte ferait des allers-retours sans fin ; jamais avec ?… ou #… (retour Google, liens). -->
  <script>
    try {
      var tlDest = localStorage.getItem("tl-landing");
      if (tlDest && !location.search && !location.hash && !sessionStorage.getItem("tl-fast")) {
        for (var j = 0; j < localStorage.length; j++) {
          var kk = localStorage.key(j);
          if (/^sb-.+-auth-token$/.test(kk) && localStorage.getItem(kk)) {
            sessionStorage.setItem("tl-fast", "1");
            location.replace(tlDest === "staff" && localStorage.getItem("tl-space") !== "espace" ? "/console" : "espace.html");
            break;
          }
        }
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Polices de marque : Acumin Pro + Circe (kit Adobe uxl8yzy).
       Noto Sans = repli officiel prevu par les guidelines de marque. -->
  <link rel="stylesheet" href="https://use.typekit.net/uxl8yzy.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=420" />
  <!-- Déjà connecté (session mémorisée) : on n'affiche PAS le formulaire le temps de la redirection — sinon, à chaque
       ouverture de l'app, l'écran de login apparaît une seconde. Décidé avant le premier affichage, d'où le script ici.
       Si la session s'avère expirée, connexion.js ré-affiche le formulaire. -->
  <script>
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^sb-.+-auth-token$/.test(k) && localStorage.getItem(k)) { document.documentElement.classList.add("cnx-resuming"); break; }
      }
    } catch (e) {}
  </script>
  <style>
    .cnx-resuming .cnx-card { visibility: hidden; }
    .cnx-resuming .cnx-wrap::before { content: ""; position: fixed; top: 50%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border: 3px solid rgba(18,60,196,.18); border-top-color: #123cc4; border-radius: 50%; animation: cnxspin .8s linear infinite; }
    @keyframes cnxspin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="cnx-body">
  <main class="cnx-wrap">
    <form id="login-form" class="cnx-card">
      <img class="cnx-logo" src="assets/logo-academie.webp" alt="Team Lausanne Academy" />
      <h1>Connexion</h1>
      <p class="cnx-sub">Accès équipe &amp; espace membre</p>
      <label class="cnx-field"><span>Email</span><input type="email" id="email" autocomplete="email" required /></label>
      <label class="cnx-field"><span>Mot de passe</span><input type="password" id="password" autocomplete="current-password" required /></label>
      <button type="submit" id="login-btn">Se connecter</button>
      <p id="login-error" class="cnx-error" hidden></p>
      <p style="margin:12px 0 0;text-align:center;font-size:.88rem"><a href="reset.html" id="forgot-link">Mot de passe oublié ?</a></p>
    </form>
  </main>
  <script type="module" src="connexion.js"></script>
</body>
</html>
