<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123cc4" />
  <title>Activer mon compte — Team Lausanne</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="public" data-world="club">
  <section class="screen center">
    <div class="card" style="max-width:380px">
      <h2 class="brand blue">🎾 Activer mon compte</h2>
      <p id="sp-wait" class="muted">Vérification du lien…</p>
      <form id="sp-form" class="hidden" style="display:flex;flex-direction:column;gap:12px">
        <p class="muted" style="margin:0">Choisissez votre mot de passe.</p>
        <label>Mot de passe<input type="password" id="sp-pass" autocomplete="new-password" required /></label>
        <label>Confirmer<input type="password" id="sp-pass2" autocomplete="new-password" required /></label>
        <button type="submit">Activer mon compte</button>
        <p id="sp-error" class="error" hidden></p>
      </form>
    </div>
  </section>
  <script type="module" src="set-password.js"></script>
</body>
</html>
