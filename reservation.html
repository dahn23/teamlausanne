<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Réservation des courts — Team Lausanne</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="app" class="screen">
    <header class="topbar">
      <a href="index.html" class="brand-sm">🎾 Team Lausanne</a>
      <span class="spacer"></span>
      <a id="admin-link" href="admin.html" class="ghost hidden">Console admin</a>
      <span id="who" class="muted"></span>
      <button id="logout" class="ghost">Déconnexion</button>
    </header>

    <h1 class="page-title">Réservation des courts</h1>

    <div class="toolbar">
      <button id="prev-day" class="nav" aria-label="Jour précédent">‹</button>
      <input type="date" id="date" />
      <button id="next-day" class="nav" aria-label="Jour suivant">›</button>
      <span id="season-tag" class="tag"></span>
    </div>

    <div id="grid-wrap" class="grid-wrap">
      <div id="grid" class="grid"></div>
    </div>

    <p class="legend">
      <span class="chip free"></span> Libre &nbsp;
      <span class="chip mine"></span> Ma réservation &nbsp;
      <span class="chip busy"></span> Occupé
    </p>
  </section>

  <script type="module" src="reservation.js"></script>
</body>
</html>
