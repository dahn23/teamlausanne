<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123cc4" />
  <title>Sondage — Team Lausanne</title>
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body class="public" data-world="academie">
  <section class="screen center">
    <div class="card" style="max-width:520px;width:100%">
      <h2 class="brand green"><svg class="hi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M4.7 6.5c3.2 2 3.2 9 0 11M19.3 6.5c-3.2 2-3.2 9 0 11"/></svg>Ton avis compte</h2>
      <p id="sv-wait" class="muted">Chargement du sondage…</p>
      <form id="sv-form" class="hidden" style="display:flex;flex-direction:column;gap:16px">
        <h3 id="sv-title" style="margin:0"></h3>
        <p id="sv-intro" class="muted" style="margin:0"></p>
        <div id="sv-questions" style="display:flex;flex-direction:column;gap:18px"></div>
        <button type="submit">Envoyer</button>
        <p id="sv-error" class="error" hidden></p>
      </form>
      <div id="sv-done" class="hidden">
        <p style="font-size:1.1rem">Merci pour ta réponse !</p>
        <p class="muted">Ton retour nous aide à améliorer les prochains tournois.</p>
      </div>
    </div>
  </section>
  <script type="module" src="sondage.js"></script>
</body>
</html>
