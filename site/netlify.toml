# /academy est encore indexée par Google : elle vient du site Wix et sort
# toujours dans les résultats. Elle répondait 404 — ce qui dit à Google
# d'oublier la page, et jette au passage tout ce qu'elle avait accumulé. Un 301
# transmet cette valeur à la page qui l'a remplacée, et le visiteur arrive sur
# quelque chose plutôt que sur une erreur.
[[redirects]]
  from = "/academy"
  to = "/"
  status = 301
