# Site statique — aucune étape de build (pages HTML/JS servies telles quelles).

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200
[build]
  publish = "."
  # Fabrique une vraie page HTML par programme (voir build.mjs). Le script
  # tourne ICI, sur les serveurs de Netlify : nos machines n'ont pas Node et
  # n'en ont pas besoin — « git push » reste le seul geste à faire.
  command = "node build.mjs"

# ============================================================
#  lausanneopen.ch → teamlausanne.ch (décidé le 07.09.2026)
#  Ce même dossier est déployé sur DEUX sites Netlify : teamlausanne.ch (site public)
#  et lausanneopen.ch (ancien site du tournoi). Les règles « par domaine » ci-dessous ne
#  s'appliquent qu'aux requêtes arrivant sur lausanneopen.ch : la page d'accueil part sur
#  la page /lausanne-open (une vraie page : Google ignore le « #tournoi » d'une adresse, 25.10.2026),
#  les autres adresses (formulaires…) gardent leur chemin.
#  players.lausanneopen.ch (Player Hub) et welcome.lausanneopen.ch sont des sites à part : intouchés.
# ============================================================
[[redirects]]
  from = "https://lausanneopen.ch/"
  to = "https://teamlausanne.ch/lausanne-open"
  status = 301
  force = true
[[redirects]]
  from = "https://www.lausanneopen.ch/"
  to = "https://teamlausanne.ch/lausanne-open"
  status = 301
  force = true
[[redirects]]
  from = "http://lausanneopen.ch/"
  to = "https://teamlausanne.ch/lausanne-open"
  status = 301
  force = true
[[redirects]]
  from = "http://www.lausanneopen.ch/"
  to = "https://teamlausanne.ch/lausanne-open"
  status = 301
  force = true
