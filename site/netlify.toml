# Site statique — aucune étape de build (pages HTML/JS servies telles quelles).
[build]
  publish = "."
  command = ""

# ============================================================
#  lausanneopen.ch → teamlausanne.ch (décidé le 07.09.2026)
#  Ce même dossier est déployé sur DEUX sites Netlify : teamlausanne.ch (site public)
#  et lausanneopen.ch (ancien site du tournoi). Les règles « par domaine » ci-dessous ne
#  s'appliquent qu'aux requêtes arrivant sur lausanneopen.ch : la page d'accueil part sur
#  l'onglet Lausanne Open, les autres adresses (formulaires…) gardent leur chemin.
#  players.lausanneopen.ch (Player Hub) et welcome.lausanneopen.ch sont des sites à part : intouchés.
# ============================================================
[[redirects]]
  from = "https://lausanneopen.ch/"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "https://www.lausanneopen.ch/"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "http://lausanneopen.ch/"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "http://www.lausanneopen.ch/"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
# Anciennes adresses Wix du tournoi (mails, flyers, Google) → onglet Lausanne Open
[[redirects]]
  from = "https://lausanneopen.ch/partenariats"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "https://lausanneopen.ch/programmedujour"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "https://lausanneopen.ch/apropos"
  to = "https://teamlausanne.ch/#tournoi"
  status = 301
  force = true
[[redirects]]
  from = "https://lausanneopen.ch/events"
  to = "https://teamlausanne.ch/samedi-famille"
  status = 301
  force = true
[[redirects]]
  from = "https://lausanneopen.ch/initiation"
  to = "https://teamlausanne.ch/samedi-famille"
  status = 301
  force = true
# Tout le reste (samedi-famille, tennis-lunchs, fichiers…) : même chemin sur teamlausanne.ch
[[redirects]]
  from = "https://lausanneopen.ch/*"
  to = "https://teamlausanne.ch/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.lausanneopen.ch/*"
  to = "https://teamlausanne.ch/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://lausanneopen.ch/*"
  to = "https://teamlausanne.ch/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.lausanneopen.ch/*"
  to = "https://teamlausanne.ch/:splat"
  status = 301
  force = true


# --- Les deux pages d'inscription gardent leur adresse exacte ---
[[redirects]]
  from = "/samedi-famille"
  to = "/samedi-famille.html"
  status = 200
[[redirects]]
  from = "/tennis-lunchs"
  to = "/tennis-lunchs.html"
  status = 200

# --- Anciennes adresses du site Wix : aucune ne doit tomber en 404 ---
[[redirects]]
  from = "/partenariats"
  to = "/#partenaires"
  status = 301
[[redirects]]
  from = "/programmedujour"
  to = "/#infos"
  status = 301
[[redirects]]
  from = "/apropos"
  to = "/#presentation"
  status = 301
[[redirects]]
  from = "/events"
  to = "/samedi-famille"
  status = 301
[[redirects]]
  from = "/initiation"
  to = "/samedi-famille"
  status = 301

# --- Rien de Team Lausanne n'est accessible depuis ce domaine ---
[[redirects]]
  from = "/console"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Site public teamlausanne.ch : Academy + Lausanne Open ---
# Adresse propre du tournoi (utilisée quand lausanneopen.ch redirigera ici).
[[redirects]]
  from = "/lausanne-open"
  to = "/#tournoi"
  status = 301
# Aucune réservation ni connexion sur le site public : l'app est sur app.teamlausanne.ch.
[[redirects]]
  from = "/reservation*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/connexion*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/espace*"
  to = "/"
  status = 301
  force = true
