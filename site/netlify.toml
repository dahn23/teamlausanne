[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- Site public teamlausanne.ch : Academy + Lausanne Open ---
# Un article publié APRÈS le dernier déploiement n'a pas encore de fichier :
# build.mjs lit les actualités au moment du build. Sans règle, son adresse
# renverrait une 404 sèche jusqu'au prochain « git push », et un lien partagé
# sur Instagram tomberait dans le vide.
#
# On sert donc l'application, qui route côté navigateur et affiche l'article —
# mais avec un statut 404, et c'est voulu.
#
# Un humain ne voit pas le statut : il lit son article, le lien partagé marche.
# Un robot, lui, ne lit que le statut : il passe son chemin au lieu d'indexer
# la page d'accueil sous vingt adresses inventées. En 200, /actualites/
# n-importe-quoi répondait « tout va bien » — une soft 404, que Google compte
# comme une erreur de qualité.
#
# Dès que le fichier existe, Netlify le sert en priorité, en 200 : cette règle
# ne concerne QUE les adresses sans page.
[[redirects]]
  from = "/actualites/*"
  to = "/index.html"
  status = 404

# /lausanne-open est désormais une VRAIE page, fabriquée par build.mjs.
# L'ancienne règle la renvoyait vers /#tournoi : elle se serait redirigée
# elle-même, et la page n'aurait jamais été servie.
# Aucune réservation ni connexion sur le site public : l'app est sur app.teamlausanne.ch.
[[redirects]]
  from = "/reservation*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/connexion*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/espace*"
  to = "/"
  status = 301
  force = true
