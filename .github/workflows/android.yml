# Fabrique l'app Android de TEST (APK) dans le cloud : aucune installation sur les postes de l'équipe.
# L'app est une coquille qui ouvre https://app.teamlausanne.ch — le site se met à jour par git push, comme avant ;
# ce flux ne sert que lorsque la coquille elle-même change (icône, nom, autorisations).
# Résultat : onglet « Actions » du dépôt -> dernier « App Android (test) » -> en bas, « Artifacts » -> teamlausanne-android-test.
name: App Android (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Projet Android (généré à chaque fois, pas stocké dans le dépôt)
        run: npx cap add android
      - name: Configuration Firebase (notifications)
        # Le fichier google-services.json vit dans les secrets du dépôt (le dépôt est public) ; il est recréé ici.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON absent : pas de notifications possibles."; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const p=j.client.map(c=>c.client_info.android_client_info.package_name); if(!p.includes('ch.teamlausanne.app')){console.error('::error::google-services.json ne contient pas le package ch.teamlausanne.app (trouvé : '+p.join(', ')+')'); process.exit(1)} console.log('Firebase OK pour', p.join(', '))"
      # L'icône vient de mobile/assets/logo.png (posé sur du blanc) ; l'écran de
      # démarrage vient de mobile/assets/splash.png et splash-dark.png, qui sont
      # lus indépendamment du logo. Les couleurs ci-dessous ne servent donc qu'au
      # fond de fenêtre — mais sur Android 12+ c'est LUI qu'on voit : le système
      # ignore l'image et affiche l'icône sur cette couleur. D'où le bleu.
      - name: Icônes et écran de démarrage
        id: assets
        continue-on-error: true   # sans icône générée, l'app se fabrique quand même (icône par défaut)
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#1e3ad1' --splashBackgroundColorDark '#04205e'
      # Sans ce garde-fou, une génération ratée passait inaperçue : l'app partait
      # avec l'icône par défaut de Capacitor et personne ne faisait le lien.
      - name: Alerte si les images n'ont pas été générées
        if: steps.assets.outcome == 'failure'
        run: echo "::error::Icônes et écran de démarrage NON générés — l'app va être fabriquée avec les images par défaut de Capacitor. Vérifier mobile/assets/ (logo.png 1024x1024, splash.png et splash-dark.png 2732x2732)."
      - name: Android 16 (API 36) — exigé par le Play Store depuis août 2026
        # Capacitor 7 génère un projet qui vise l'API 35 ; le Play Store refuse tout envoi sous 36.
        run: |
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" android/variables.gradle
      - name: Synchronisation
        run: npx cap sync android
      - name: Fabrication de l'APK de test
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: teamlausanne-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---- Version Play Store (AAB signé) : seulement si la clé de signature est déposée dans les secrets du dépôt ----
      - name: Version Play Store (AAB signé)
        id: release
        working-directory: mobile/android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Clé de signature absente (secrets UPLOAD_KEYSTORE_B64 / UPLOAD_KEYSTORE_PASSWORD) : version Play Store non fabriquée."
            echo "done=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PASS="$(printf '%s' "$UPLOAD_KEYSTORE_PASSWORD" | tr -d '\r\n ')"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          # Le numéro de version interne doit augmenter à chaque envoi au Play Store : on prend le numéro de fabrication.
          CODE=$(( 100 + GITHUB_RUN_NUMBER ))
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/; s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-key.p12" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$PASS"
          rm -f "$RUNNER_TEMP/upload-key.p12"
          echo "done=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.done == 'yes'
        with:
          name: teamlausanne-playstore
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
