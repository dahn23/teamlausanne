# Fabrique l'app Android de TEST (APK) dans le cloud : aucune installation sur les postes de l'équipe.
# L'app est une coquille qui ouvre https://app.teamlausanne.ch — le site se met à jour par git push, comme avant ;
# ce flux ne sert que lorsque la coquille elle-même change (icône, nom, autorisations).
# Résultat : onglet « Actions » du dépôt -> dernier « App Android (test) » -> en bas, « Artifacts » -> teamlausanne-android-test.
name: App Android (test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Projet Android (généré à chaque fois, pas stocké dans le dépôt)
        run: npx cap add android
      - name: Configuration Firebase (notifications)
        # Le fichier google-services.json vit dans les secrets du dépôt (le dépôt est public) ; il est recréé ici.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON absent : pas de notifications possibles."; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "const j=require('./android/app/google-services.json'); const p=j.client.map(c=>c.client_info.android_client_info.package_name); if(!p.includes('ch.teamlausanne.app')){console.error('::error::google-services.json ne contient pas le package ch.teamlausanne.app (trouvé : '+p.join(', ')+')'); process.exit(1)} console.log('Firebase OK pour', p.join(', '))"
      - name: Icônes et écran de démarrage
        continue-on-error: true   # sans icône générée, l'app se fabrique quand même (icône par défaut)
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Synchronisation
        run: npx cap sync android
      - name: Fabrication de l'APK de test
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: teamlausanne-android-test
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
