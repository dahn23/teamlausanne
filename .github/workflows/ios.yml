# Fabrique l'app iPhone dans le cloud (Mac prêté par GitHub) : aucun Mac ni Xcode dans l'équipe.
# Même coquille que l'Android : elle ouvre https://app.teamlausanne.ch, le site se met à jour par git push.
#
# Sans les secrets Apple : on vérifie seulement que l'app se fabrique (version simulateur, non signée).
# Avec les secrets : version signée envoyée directement sur App Store Connect → TestFlight (environ 15 min
# de traitement chez Apple), puis installation sur iPhone par l'app TestFlight.
# Secrets du dépôt (posés par Dan, jamais dans un fichier) :
#   APPLE_TEAM_ID         identifiant d'équipe Apple (10 caractères, page Membership)
#   ASC_KEY_ID            identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID         « Issuer ID » affiché au-dessus de la liste des clés
#   ASC_KEY_P8            contenu complet du fichier AuthKey_XXXX.p8 (rôle Admin : il crée lui-même les certificats)
# Secrets posés par Dan le 16.10.2026.
name: App iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -iv -E "beta|rc" | sort -V | tail -1)" && xcodebuild -version   # Apple exige le SDK le plus récent
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Projet iOS (généré à chaque fois, pas stocké dans le dépôt)
        run: npx cap add ios
      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Réglages de l'app (notifications, version, chiffrement)
        working-directory: mobile/ios/App
        run: |
          P=App/Info.plist
          # Pas de chiffrement propre (seulement HTTPS) : évite la question d'export à chaque envoi.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Team Lausanne" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Team Lausanne" $P
          # Numéro de fabrication : doit augmenter à chaque envoi chez Apple.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" $P
          # iOS 15 minimum : Apple refuse les apps visant iOS 14 dès avril 2027 (avertissement ITMS-90068).
          # iPhone seulement : une app « iPhone + iPad » oblige à fournir aussi des captures et une mise en page iPad.
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?;/TARGETED_DEVICE_FAMILY = 1;/' App.xcodeproj/project.pbxproj
          grep -m1 "TARGETED_DEVICE_FAMILY" App.xcodeproj/project.pbxproj || true
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/" App.xcodeproj/project.pbxproj
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" Podfile
          grep -m1 "platform :ios" Podfile
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/; s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = 1.0;/" App.xcodeproj/project.pbxproj
          # Droit « notifications » (APNs, production : TestFlight et App Store).
          cat > App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>
          EOF
          sed -i '' -E 's/^ +//' App/App.entitlements
          # Le module de notifications de Capacitor a besoin que l'app lui transmette le jeton d'Apple.
          python3 - <<'PY'
          import re
          p = "App/AppDelegate.swift"
          s = open(p).read()
          if "capacitorDidRegisterForRemoteNotifications" not in s:
              add = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind("}")
              s = s[:i] + add + "}\n"
              open(p, "w").write(s)
          PY
          grep -n "RemoteNotifications" App/AppDelegate.swift
      - name: Synchronisation
        run: npx cap sync ios

      - name: Contrôle (version simulateur, sans signature)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
          echo "::notice::L'app iPhone se fabrique correctement."

      - name: Version signée → App Store Connect (TestFlight)
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Secrets Apple absents : version TestFlight non fabriquée."; exit 0
          fi
          TEAM="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n ')"; KID="$(printf '%s' "$ASC_KEY_ID" | tr -d '\r\n ')"; ISS="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '\r\n ')"
          KEY="$RUNNER_TEMP/AuthKey_${KID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          # Ajoute le fichier de droits au projet (signature automatique : Xcode crée certificat et profil lui-même).
          sed -i '' -E "s/(PRODUCT_BUNDLE_IDENTIFIER = ch\.teamlausanne\.app;)/\1 CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/" App.xcodeproj/project.pbxproj
          # En cas d'échec, les erreurs d'Xcode sont recopiées dans le résumé public de la fabrication (annotations).
          show() { grep -E "error|Error|No profiles|provisioning|certificate" "$1" | grep -v -E "^[[:space:]]*$" | sort -u | head -15 | while IFS= read -r l; do echo "::error::$l"; done; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          # 1) Archive SANS signature : la signature « développement » d'Xcode exige un iPhone enregistré chez Apple.
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO             archive -quiet > "$RUNNER_TEMP/archive.log" 2>&1 || { show "$RUNNER_TEMP/archive.log"; exit 1; }
          # 1 bis) Signature provisoire « ad hoc » portant les droits (notifications) : l'export App Store reprend les
          # droits inscrits dans l'app archivée ; une archive non signée n'en porte aucun.
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements App/App.entitlements "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -q aps-environment && echo "Droits posés sur l'archive."
          # 2) Signature App Store à l'export (certificat géré par Apple dans le cloud, profil créé automatiquement).
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist"             -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || { show "$RUNNER_TEMP/export.log"; exit 1; }
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          # 3) Contrôle : l'app signée doit porter le droit aux notifications.
          mkdir -p "$RUNNER_TEMP/ipa" && (cd "$RUNNER_TEMP/ipa" && unzip -q "$IPA")
          ENT="$(codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app 2>/dev/null || true)"
          if printf '%s' "$ENT" | grep -q "aps-environment"; then echo "::notice::Signature App Store OK, notifications incluses."; else echo "::warning::Signée, mais sans le droit aux notifications (aps-environment)."; fi
          # 4) Envoi à App Store Connect.
          mkdir -p ~/.appstoreconnect/private_keys && cp "$KEY" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$KID" --apiIssuer "$ISS" > "$RUNNER_TEMP/upload.log" 2>&1 || { show "$RUNNER_TEMP/upload.log"; exit 1; }
          rm -rf ~/.appstoreconnect/private_keys
          rm -f "$KEY"
          echo "::notice::Fabrication ${GITHUB_RUN_NUMBER} envoyée à App Store Connect : elle apparaît dans TestFlight après le traitement d'Apple."
